<!DOCTYPE html>
<html lang="en">
<head>
  link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA 6 AI Clipper</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101018;
      color: white;
      text-align: center;
    }
    header {
      padding: 25px;
      background: #191927;
    }
    h1 { color: #ff4fa3; }
    .hero { padding: 50px 20px; }
    .upload-box {
      max-width: 500px;
      margin: 25px auto;
      padding: 30px 20px;
      background: #1d1d2b;
      border: 2px dashed #ff4fa3;
      border-radius: 15px;
    }
    button {
      padding: 14px 25px;
      background: #ff4fa3;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>GTA 6 AI CLIPPER</h1>
  </header>

  <section class="hero">
    <h2>Turn Long Videos Into Short Clips</h2>
    <p>Create vertical clips for YouTube Shorts, Instagram Reels and TikTok.</p>

    <div class="upload-box">
      <h3>Upload Your Video</h3>
      <input type="file" accept="video/*">
      <br><br>
      <button onclick="alert('AI processing will be added later')">
        Start Clipping
      </button>
    </div>
  </section>
</body>
</html>
